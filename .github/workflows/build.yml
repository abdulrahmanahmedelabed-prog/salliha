name: Salliha apps (Windows + Android)

on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist:win
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: salliha-windows
          path: dist/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run icons
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#12372a' --splashBackgroundColor '#f4f1ea'
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk salliha.apk
      - uses: actions/upload-artifact@v4
        with:
          name: salliha-android
          path: salliha.apk
